<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:#0f0f0f;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:16px;
    min-height:100vh;min-height:100dvh;
    overflow-x:hidden;
  }
  .bg{
    position:fixed;inset:0;
    background-image:url("pattern.svg");
    background-size:420px auto;
    background-repeat:repeat;
    filter:invert(1);
    opacity:.045;
    pointer-events:none;
    z-index:0;
  }
  .card{
    position:relative;z-index:1;
    width:100%;max-width:408px;
    background:#212121;
    border-radius:12px;
    padding:34px 24px 30px;
    text-align:center;
  }
  .ava{
    width:120px;height:120px;border-radius:50%;
    object-fit:cover;display:block;margin:0 auto 18px;
  }
  .title{
    color:#fff;font-size:21px;font-weight:600;
    line-height:1.25;margin:0 0 6px;
    letter-spacing:-.2px;
  }
  .title .flag{
    font-size:13px;font-weight:600;letter-spacing:.3px;
    vertical-align:baseline;margin-left:2px;
  }
  .extra{
    color:#8a8a8a;font-size:15px;margin:0 0 20px;
  }
  .desc{
    color:#d6d6d6;font-size:15px;line-height:1.45;
    margin:0 0 26px;white-space:pre-line;
  }
  .btn{
    display:block;width:100%;
    border:none;cursor:pointer;
    font-family:inherit;
    font-size:14px;font-weight:600;
    letter-spacing:.6px;text-transform:uppercase;
    padding:13px 20px;border-radius:22px;
    text-decoration:none;text-align:center;
    transition:background .15s,opacity .15s;
  }
  .btn-join{
    background:#2ea6ff;color:#fff;margin-bottom:12px;
  }
  .btn-join:active{background:#1f95ee}
  .btn-web{
    background:transparent;color:#2ea6ff;
    border:1px solid #2ea6ff;
  }
  .btn-web:active{opacity:.7}

  @media (max-width:380px){
    .card{padding:28px 18px 24px;border-radius:10px}
    .ava{width:104px;height:104px}
    .title{font-size:19px}
    .desc{font-size:14.5px}
  }

<body>

<div class="bg"></div>

<div class="card">

🥇 300.000$ депозита в 19 лет
…</div>

  <!-- ССЫЛКА 1: сюда ставишь свой канал или бота -->
  <a class="btn btn-join" id="joinBtn" href="https://t.me/gotoChannelBot?startapp=TLc228da447b6947">Join Channel</a>

  <!-- ССЫЛКА 2: та же ссылка -->
  <a class="btn btn-web" id="webBtn" href="https://t.me/gotoChannelBot?startapp=TLc228da447b6947">Open in Web</a>
</div>

<script>
  // Берёт номер креатива из адреса страницы (например ?c=3)
  // и ставит в обе кнопки нужную трекинговую ссылку.
  (function () {
    var p = new URLSearchParams(location.search);
    var c = (p.get('c') || '').trim();
    var url = (window.LINKS && window.LINKS[c]) ? window.LINKS[c] : window.LINK_DEFAULT;

    ['joinBtn', 'webBtn'].forEach(function (id) {
      var a = document.getElementById(id);
      if (!a) return;
      a.href = url;
      a.addEventListener('click', function () {
        if (window.fbq) { fbq('track', 'ViewContent', { content_name: 'creo_' + (c || 'none') }); }
      });
    });
  })();
</script>

</body>
